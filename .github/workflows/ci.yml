name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Build
        run: npm run build --if-present

  phi-guard:
    name: PHI-free zone guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 503MD's public site is a PHI-free educational reference + provider
      # gateway. It must never collect health information or load ad/analytics
      # pixels. Any clinical/fulfillment layer lives behind a separate system.
      - name: Scan for forbidden trackers / PHI collection
        run: |
          set -e
          PATTERN='connect\.facebook\.net|fbevents\.js|googletagmanager\.com|google-analytics\.com|gtag\(|fbq\(|hotjar|clarity\.ms|tiktok.*pixel'
          if grep -rInE "$PATTERN" src/ 2>/dev/null; then
            echo "::error::Forbidden third-party tracker found in the PHI-free zone."
            exit 1
          fi
          echo "No forbidden trackers found."
